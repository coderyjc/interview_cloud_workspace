<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>云端 Agent 工作台</title>
    <style>
      :root {
        --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --line: #2a2f3a;
        --text: #e6e8ee; --muted: #8b93a7; --accent: #5b8cff; --accent-2: #3a6df0;
        --ok: #35c46b; --err: #ff6b6b; --warn: #f0b34a;
        --badge-bg: #2b3140; --tool-name: #c9d4ff; --link: #a9c0ff; --label: #6e768a;
        --scroll-thumb: #3a4353; --scroll-thumb-hover: #4f5a70; --scroll-track: transparent;
        --syn-keyword: #c792ea; --syn-string: #a5e075; --syn-number: #f78c6c;
        --syn-title: #82aaff; --syn-attr: #ffcb6b; --syn-meta: #89ddff;
      }
      :root[data-theme="light"] {
        --bg: #f5f7fb; --panel: #ffffff; --panel-2: #eef2f8; --line: #dde3ee;
        --text: #1b2030; --muted: #5d6679; --accent: #3f6bf0; --accent-2: #3a6df0;
        --ok: #1f9d63; --err: #d64545; --warn: #b7791f;
        --badge-bg: #e6ebf6; --tool-name: #2f4fae; --link: #2f5bd6; --label: #8a93a7;
        --scroll-thumb: #c6cede; --scroll-thumb-hover: #aab4c9; --scroll-track: transparent;
        --syn-keyword: #a626a4; --syn-string: #50a14f; --syn-number: #986801;
        --syn-title: #4078f2; --syn-attr: #c18401; --syn-meta: #0184bc;
      }
      * { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) var(--scroll-track); }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: var(--scroll-track); }
      *::-webkit-scrollbar-thumb {
        background: var(--scroll-thumb); border-radius: 999px;
        border: 2px solid transparent; background-clip: padding-box;
      }
      *::-webkit-scrollbar-thumb:hover {
        background: var(--scroll-thumb-hover); border: 2px solid transparent; background-clip: padding-box;
      }
      *::-webkit-scrollbar-corner { background: transparent; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: var(--bg); color: var(--text); font-size: 14px;
      }
      .app { display: grid; grid-template-columns: 260px 1fr 300px; height: 100%; }
      .sidebar { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      .brand { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .brand .title { font-weight: 700; font-size: 15px; letter-spacing: .3px; }
      .brand .title span { color: var(--accent); }
      .theme-toggle {
        border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
        border-radius: 8px; padding: 5px 9px; font-size: 12px; cursor: pointer; white-space: nowrap;
      }
      .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
      .newbtns { display: flex; gap: 8px; padding: 12px; }
      .newbtns button {
        flex: 1; padding: 8px 6px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px;
      }
      .newbtns button:hover { border-color: var(--accent); color: var(--text); }
      .sessionlist { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
      .session {
        padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 6px;
        border: 1px solid transparent; position: relative;
      }
      .session:hover { background: var(--panel-2); }
      .session.active { background: var(--panel-2); border-color: var(--accent); }
      .session .title { font-size: 13px; margin-bottom: 4px; display: flex; gap: 6px; align-items: center; }
      .session .last { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--badge-bg); color: var(--muted); }
      .badge.dev { color: var(--accent); }
      .badge.daily { color: var(--ok); }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-left: auto; }
      .dot.running { background: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,.2); animation: pulse 1.2s infinite; }
      @keyframes pulse { 50% { opacity: .4; } }
      .del { position: absolute; right: 8px; top: 8px; color: var(--muted); font-size: 12px; opacity: 0; }
      .session:hover .del { opacity: 1; }
      .del:hover { color: var(--err); }

      .chat { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
      .chat-header { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
      .chat-header h2 { font-size: 14px; margin: 0; font-weight: 600; }
      .chat-header .status { font-size: 12px; color: var(--muted); }
      .chat-header .status.running { color: var(--accent); }
      .chat-header .grow { flex: 1; }
      .btn {
        padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
        background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 12px;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.danger:hover { border-color: var(--err); color: var(--err); }
      .btn:disabled { opacity: .45; cursor: not-allowed; }

      .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
      .empty { margin: auto; color: var(--muted); text-align: center; line-height: 1.9; font-size: 13px; }
      .msg { display: flex; }
      .msg.user { justify-content: flex-end; }
      .bubble { max-width: 78%; padding: 10px 13px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
      .msg.user .bubble { background: var(--accent-2); color: #fff; border-bottom-right-radius: 4px; }
      .msg.assistant .bubble { background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
      .cursor { display: inline-block; width: 7px; margin-left: 2px; animation: blink 1s steps(2) infinite; }
      @keyframes blink { 50% { opacity: 0; } }

      .tool { width: 78%; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
      .tool-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; font-size: 12.5px; }
      .tool-head .name { font-weight: 600; color: var(--tool-name); }
      .tool-head .st { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 999px; }
      .st.running { background: rgba(91,140,255,.15); color: var(--accent); }
      .st.done { background: rgba(53,196,107,.15); color: var(--ok); }
      .st.error { background: rgba(255,107,107,.15); color: var(--err); }
      .tool-body { border-top: 1px solid var(--line); padding: 10px 12px; font-size: 12px; color: var(--muted); }
      .tool-body pre { margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 240px; overflow: auto; font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; }
      .tool-body .label { font-size: 11px; color: var(--label); margin: 6px 0 4px; text-transform: uppercase; letter-spacing: .5px; }

      .composer { border-top: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 10px; align-items: flex-end; }
      .composer textarea {
        flex: 1; resize: none; height: 46px; padding: 10px 12px; border-radius: 10px;
        border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
        font-family: inherit; font-size: 13px; outline: none;
      }
      .composer textarea:focus { border-color: var(--accent); }
      .composer .send { padding: 10px 18px; height: 46px; border-radius: 10px; border: none; background: var(--accent); color: #fff; cursor: pointer; font-weight: 600; }
      .composer .send:disabled { opacity: .4; cursor: not-allowed; }
      .errorbar { background: rgba(255,107,107,.12); color: var(--err); padding: 8px 18px; font-size: 12px; border-top: 1px solid rgba(255,107,107,.25); }

      .files { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
      .files-head { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
      .files-head .grow { flex: 1; }
      .files-actions { padding: 10px 14px; }
      .upload { display: block; text-align: center; padding: 8px; border: 1px dashed var(--line); border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 12px; }
      .upload:hover { border-color: var(--accent); color: var(--text); }
      .filelist { flex: 1; overflow-y: auto; padding: 4px 8px 12px; }
      .file { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 12px; }
      .file:hover { background: var(--panel-2); }
      .file-name {
        flex: 1; min-width: 0; background: none; border: none; padding: 0;
        font: inherit; text-align: left; color: var(--link); cursor: pointer;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .file-name:hover { text-decoration: underline; }
      .file .size { color: var(--muted); font-size: 10.5px; }
      .file .file-dl { color: var(--muted); text-decoration: none; font-size: 12px; }
      .file .file-dl:hover { color: var(--accent); }
      .no-files { color: var(--muted); font-size: 12px; padding: 14px; text-align: center; }

      /* file preview modal */
      .modal-overlay {
        position: fixed; inset: 0; z-index: 50; padding: 24px;
        background: rgba(6, 8, 14, .55); backdrop-filter: blur(2px);
        display: flex; align-items: center; justify-content: center;
      }
      .modal {
        width: min(920px, 100%); height: min(80vh, 760px);
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        display: flex; flex-direction: column; overflow: hidden;
        box-shadow: 0 30px 80px -24px rgba(0, 0, 0, .55);
      }
      .modal-head {
        display: flex; align-items: center; gap: 10px;
        padding: 11px 16px; border-bottom: 1px solid var(--line);
      }
      .modal-title { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .modal-meta { color: var(--muted); font-size: 12px; margin-left: auto; white-space: nowrap; }
      .modal-head .btn { text-decoration: none; }
      .modal-body { flex: 1; overflow: auto; background: var(--bg); }
      pre.code {
        margin: 0; padding: 16px 18px; font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px; line-height: 1.6; white-space: pre; tab-size: 4;
      }
      pre.code code { font-family: inherit; }

      /* highlight.js tokens (theme-aware) */
      .hljs { color: var(--text); background: transparent; }
      .hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
      .hljs-keyword, .hljs-selector-tag, .hljs-built_in, .hljs-type, .hljs-literal { color: var(--syn-keyword); }
      .hljs-string, .hljs-attr, .hljs-template-variable, .hljs-regexp { color: var(--syn-string); }
      .hljs-number, .hljs-boolean, .hljs-symbol { color: var(--syn-number); }
      .hljs-title, .hljs-title.function_, .hljs-section, .hljs-name { color: var(--syn-title); }
      .hljs-variable, .hljs-attribute, .hljs-tag, .hljs-selector-attr { color: var(--syn-attr); }
      .hljs-meta, .hljs-selector-id, .hljs-selector-class, .hljs-doctag { color: var(--syn-meta); }
      .hljs-emphasis { font-style: italic; }
      .hljs-strong { font-weight: 700; }

      /* approval modal / diff */
      .modal-foot {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px; border-top: 1px solid var(--line);
      }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      .btn.primary:hover { filter: brightness(1.06); border-color: var(--accent); }
      pre.diff {
        margin: 0; padding: 12px 0; font-family: ui-monospace, Consolas, monospace;
        font-size: 12.5px; line-height: 1.55; white-space: pre; tab-size: 4;
      }
      .d-line { white-space: pre; padding: 0 14px; }
      .d-add { background: rgba(53, 196, 107, .16); color: var(--ok); }
      .d-del { background: rgba(255, 107, 107, .16); color: var(--err); }
      .d-hunk { color: var(--syn-meta); }
      .d-file { color: var(--muted); font-weight: 600; }
    </style>
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
